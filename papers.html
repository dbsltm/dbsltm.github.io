  <title>Papers — Eunkyu (Eunice) Park</title>
  <meta name="description" content="Publications by Eunkyu (Eunice) Park on trustworthy and interpretable multimodal AI: vision-language models, human perception of AI reasoning, and multimodal moral and social reasoning." />
  <link rel="canonical" href="https://dbsltm.github.io/papers.html" />
  <link rel="icon" href="assets/img/love.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
      --ink: #111;
      --ink-2: #444;
      --ink-3: #666;
      --ink-4: #888;
      --rule: #e5e5e5;
      --accent: #3b6fb6;
      --serif: 'Spectral', Georgia, 'Times New Roman', serif;
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: #bbb;
      text-underline-offset: 3px;
    }
    a:hover { color: var(--accent); text-decoration-color: var(--accent); }
    strong { font-weight: 600; }

    .page {
      max-width: 840px;
      margin: 0 auto;
      padding: 56px 24px 96px;
      display: flex;
      flex-direction: column;
      gap: 56px;
    }
    nav { display: flex; gap: 20px; font-size: 15.5px; font-weight: 500; flex-wrap: wrap; }
    nav a { text-decoration: none; color: var(--ink-3); }
    nav a:hover { color: var(--accent); }
    nav a.active { color: var(--ink); font-weight: 600; }

    h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
    h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; }
    section { display: flex; flex-direction: column; gap: 16px; }
    section p { margin: 0; }

    .link-row { font-size: 15.5px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
    .text-btn {
      align-self: flex-start;
      background: none; border: none; padding: 0;
      font: inherit; font-size: 15.5px; color: var(--ink-3);
      cursor: pointer;
      text-decoration: underline; text-decoration-color: #bbb; text-underline-offset: 3px;
    }
    .text-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }

    .dated-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.55; }
    .dated-list li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
    .dated-list li > span:first-child { color: var(--ink-4); }

    footer { font-size: 14px; color: var(--ink-4); padding-top: 24px; border-top: 1px solid var(--rule); }

    @media (max-width: 480px) {
      .page { padding-top: 40px; gap: 44px; }
      h1 { font-size: 26px; }
      .dated-list li { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
  <style>
    .page { gap: 48px; }
    .papers-head { display: flex; flex-direction: column; gap: 12px; }
    .view-row { display: flex; gap: 16px; align-items: center; font-size: 15.5px; flex-wrap: wrap; }
    .view-btns { display: flex; gap: 12px; }
    .view-btn {
      font: inherit; font-size: 14px; padding: 0; border: none; background: none; cursor: pointer;
      color: var(--ink-3); text-decoration: underline; text-decoration-color: #bbb; text-underline-offset: 3px;
    }
    .view-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }
    .view-btn.active { color: var(--ink); font-weight: 700; text-decoration: none; }
    .view-note { color: var(--ink-4); }
    .abs-toggle { align-self: auto; }

    #paper-groups { display: flex; flex-direction: column; gap: 48px; }
    .group { display: flex; flex-direction: column; gap: 20px; }
    .group h2 { font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-4); }
    .paper { display: flex; flex-direction: column; gap: 6px; padding-top: 16px; border-top: 1px solid var(--rule); scroll-margin-top: 24px; }
    .paper:target h3 { color: var(--accent); }
    .paper .authors { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--ink-2); }
    .paper .authors strong { font-weight: 600; color: var(--ink); }
    .paper .meta { font-size: 15.5px; display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
    .paper .meta .venue { color: var(--ink-4); }
    .paper .abs { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }
    .paper .abs img { width: 100%; max-height: 280px; object-fit: contain; object-position: left; border-radius: 4px; }
    .paper .abs p { margin: 0; font-size: 15.5px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty; }
  </style>
  </style>

</script>
</head>
<body>

<div class="page">

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#research">Research</a>
    <a href="papers.html" class="active">Papers</a>
    <a href="assets/pdf/EunkyuPark_Resume2608.pdf">CV</a>
  </nav>

  <div class="papers-head">
    <h1>Papers</h1>
    <div class="view-row">
      <span class="view-btns" role="tablist" aria-label="Group papers">
        <button class="view-btn active" type="button" data-view="year">By year</button>
        <button class="view-btn" type="button" data-view="theme">By theme</button>
        <button class="view-btn" type="button" data-view="first">First author</button>
      </span>
      <span class="view-note">· * equal contribution</span>
    </div>
  </div>

  <div id="paper-groups"></div>

  <footer>© 2026 Eunkyu (Eunice) Park</footer>

</div>

<script>
  var PAPERS = [
    {
      id: "juryduty", year: 2026, short: "Jury Duty", theme: "Moral & social reasoning", venue: "EMNLP 2026",
      title: "Jury Duty: Calibration and Orientation Failures in MLLM-as-a-Judge Under Cultural Ambiguity",
      authors: "Daniel Lee, Harsh Sharma, <strong>Eunkyu Park</strong>, Pranav Narayanan Venkit, Jeonghwan Kim, Kah Mun Chia, Andreas Vlachos, Shafiq Joty",
      first: false,
      abstract: "Multimodal LLMs are increasingly used as judges, but their reliability breaks down under cultural ambiguity. Using paired image–prompt sets drawn from U.S. and Chinese contexts, we identify two systematic failures: a positivity-floor calibration failure (compressed use of the rating scale) and an orientation failure (defaulting to a single cultural perspective), revealing limits of MLLM-as-a-Judge for culturally situated evaluation.",
      img: "", link: "https://arxiv.org/abs/2606.20676", linkLabel: "arXiv"
    },
    {
      id: "critical", year: 2026, short: "Critical or Compliant?", theme: "Human perception of AI reasoning", venue: "EMNLP 2026",
      title: "Critical or Compliant? The Double-Edged Sword of Reasoning in Chain-of-Thought Explanations",
      authors: "<strong>Eunkyu Park</strong>, Wesley Hanwen Deng, Vasudha Varadarajan, Mingxi Yan, Gunhee Kim, Maarten Sap, Motahhare Eslami",
      first: true,
      abstract: "Explanations are often promoted as tools for transparency, but they can also foster confirmation bias. We study the double-edged role of CoT explanations in multimodal moral scenarios by systematically perturbing reasoning chains and manipulating delivery tones. We find: (1) users equate trust with outcome agreement, sustaining reliance even when reasoning is flawed, and (2) confident tone suppresses error detection while maintaining reliance — showing delivery style can override correctness.",
      img: "assets/img/critical-or-compliant-prev.png", link: "https://arxiv.org/abs/2511.12001", linkLabel: "arXiv"
    },
    {
      id: "cocot", year: 2026, short: "CoCoT", theme: "Human perception of AI reasoning", venue: "COLM 2026",
      title: "Cognitive Chain-of-Thought (CoCoT): Structured Multimodal Reasoning about Social Situations",
      authors: "<strong>Eunkyu Park</strong>, Wesley Hanwen Deng, Gunhee Kim, Motahhare Eslami, Maarten Sap",
      first: true,
      abstract: "Chain-of-Thought (CoT) prompting helps models think step by step — but what happens when they must see, understand, and judge all at once? In visual tasks grounded in social context, flat CoT often breaks down. We introduce Cognitive Chain-of-Thought (CoCoT), a prompting strategy scaffolding VLM reasoning through three stages: perception, situation, and norm. CoCoT consistently outperforms CoT and direct prompting (+8% on average) across multiple multimodal benchmarks.",
      img: "assets/img/cocot-prev-updated.png", link: "https://arxiv.org/abs/2507.20409", linkLabel: "arXiv"
    },
    {
      id: "mmscale", year: 2026, short: "MM-SCALE", theme: "Moral & social reasoning", venue: "NeurIPS 2026, Evaluations & Datasets Track",
      title: "MM-SCALE: Grounded Multimodal Moral Reasoning via Scalar Judgment and Listwise Alignment",
      authors: "<strong>Eunkyu Park</strong>, Wesley Hanwen Deng, Cheyon Jin, Matheus Kunzler Maldaner, Jordan Wheeler, Jason I. Hong, Hong Shen, Adam Perer, Ken Holstein, Motahhare Eslami, Gunhee Kim",
      first: true,
      abstract: "VLMs struggle with morally salient judgments in multimodal and socially ambiguous contexts. Prior works rely on binary or pairwise supervision, failing to capture the continuous and pluralistic nature of human moral reasoning. We present MM-SCALE, a large-scale dataset aligning VLMs with human moral preferences through 5-point scalar ratings and explicit modality grounding, enabling listwise preference optimization over ranked scenario sets for richer alignment signals and finer calibration of multimodal moral reasoning.",
      img: "", link: "https://arxiv.org/abs/2602.03665", linkLabel: "arXiv"
    },
    {
      id: "halloc", year: 2025, short: "HalLoc", theme: "Trustworthiness of VLMs", venue: "CVPR 2025",
      title: "HalLoc: Token-level Localization of Hallucinations for Vision Language Models",
      authors: "<strong>Eunkyu Park</strong>*, Minyeong Kim*, Gunhee Kim",
      first: true,
      abstract: "Hallucinations pose a significant challenge to the reliability of large vision-language models. Current detection methods often rely on computationally intensive models, leading to high latency and resource demands. We propose HalLoc, a dataset for efficient, probabilistic hallucination detection featuring 150K token-level annotated samples across VQA, instruction-following, and image captioning tasks. We also introduce a baseline model offering low-overhead, concurrent hallucination detection during generation.",
      img: "assets/img/halloc_prev.jpg", link: "https://huggingface.co/datasets/uunicee/HalLoc", linkLabel: "Dataset"
    }
  ];

  var THEME_ORDER = ["Human perception of AI reasoning", "Moral & social reasoning", "Trustworthiness of VLMs"];

  (function () {
    var container = document.getElementById('paper-groups');
    var buttons = document.querySelectorAll('.view-btn');
    var openAbs = {};

    function byYear(list) {
      var years = [];
      list.forEach(function (p) { if (years.indexOf(p.year) < 0) years.push(p.year); });
      years.sort(function (a, b) { return b - a; });
      return years.map(function (y) {
        return { label: String(y), papers: list.filter(function (p) { return p.year === y; }) };
      });
    }

    function groupsFor(mode) {
      if (mode === 'theme') {
        return THEME_ORDER.map(function (label) {
          return { label: label, papers: PAPERS.filter(function (p) { return p.theme === label; }) };
        });
      }
      if (mode === 'first') {
        return byYear(PAPERS.filter(function (p) { return p.first; }));
      }
      return byYear(PAPERS);
    }

    function renderPaper(p) {
      var open = !!openAbs[p.id];
      var html = '<article class="paper" id="' + p.id + '">' +
        '<h3>' + p.title + '</h3>' +
        '<p class="authors">' + p.authors + '</p>' +
        '<div class="meta">' +
          '<span class="venue">' + p.venue + '</span>' +
          '<a href="' + p.link + '">' + p.linkLabel + '</a>' +
          '<button class="text-btn abs-toggle" type="button" data-id="' + p.id + '" aria-expanded="' + open + '">' +
            (open ? 'Hide abstract' : 'Abstract') +
          '</button>' +
        '</div>';
      if (open) {
        html += '<div class="abs">' +
          (p.img ? '<img src="' + p.img + '" alt="' + p.short + ' figure">' : '') +
          '<p>' + p.abstract + '</p>' +
        '</div>';
      }
      return html + '</article>';
    }

    function render(mode) {
      container.innerHTML = groupsFor(mode).map(function (g) {
        return '<section class="group">' +
          '<h2>' + g.label + '</h2>' +
          g.papers.map(renderPaper).join('') +
        '</section>';
      }).join('');
      buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.view === mode); });
    }

    var mode = 'year';
    buttons.forEach(function (b) {
      b.addEventListener('click', function () { mode = b.dataset.view; render(mode); });
    });
    container.addEventListener('click', function (e) {
      var t = e.target.closest('.abs-toggle');
      if (!t) return;
      openAbs[t.dataset.id] = !openAbs[t.dataset.id];
      render(mode);
    });

    render(mode);

    // Open the abstract of a paper linked by hash (e.g. papers.html#cocot).
    if (location.hash) {
      var id = location.hash.slice(1);
      if (PAPERS.some(function (p) { return p.id === id; })) {
        openAbs[id] = true;
        render(mode);
        var el = document.getElementById(id);
        if (el) el.scrollIntoView();
      }
    }
  })();
</script>
</body>
</html>
